<svg width="600" height="500" viewBox="0 0 600 500" fill="none">
<!-- Фон приложения -->
<rect width="600" height="500" rx="12" fill="#F8FAFC"/>
<rect width="600" height="60" rx="12" fill="#1E293B"/>
<text x="20" y="38" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">Fibonacci Calc</text>
<!-- Поле ввода -->
<text x="40" y="100" font-family="sans-serif" font-size="14" font-weight="600" fill="#475569">Номер числа (n):</text>
<rect x="40" y="115" width="400" height="45" rx="8" stroke="#CBD5E1" fill="white"/>
<text x="55" y="143" font-family="monospace" font-size="18" fill="#1E293B">150</text>
<!-- Кнопка Расчитать -->
<rect x="450" y="115" width="110" height="45" rx="8" fill="#3B82F6"/>
<text x="468" y="142" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">РАСЧЕТ</text>
<!-- Основное окно результата -->
<rect x="40" y="180" width="520" height="120" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="55" y="210" font-family="monospace" font-size="16" fill="#334155" style="white-space: pre;"> 9969216677189303386214405760200 </text>
<!-- Кнопки действий -->
<rect x="40" y="310" width="120" height="30" rx="6" fill="#E2E8F0"/>
<text x="55" y="330" font-family="sans-serif" font-size="12" fill="#475569">Копировать</text>
<rect x="170" y="310" width="120" height="30" rx="6" fill="#E2E8F0"/>
<text x="185" y="330" font-family="sans-serif" font-size="12" fill="#475569">Экспорт .txt</text>
<!-- Карточки аналитики -->
<rect x="40" y="370" width="250" height="80" rx="10" fill="#EFF6FF" stroke="#DBEAFE"/>
<text x="55" y="395" font-family="sans-serif" font-size="12" fill="#1E40AF" font-weight="bold">АНАЛИЗ</text>
<text x="55" y="415" font-family="sans-serif" font-size="12" fill="#1E40AF">Длина: 32 цифры</text>
<text x="55" y="435" font-family="sans-serif" font-size="12" fill="#1E40AF">Тип: Четное</text>
<rect x="310" y="370" width="250" height="80" rx="10" fill="#F0FDF4" stroke="#DCFCE7"/>
<text x="325" y="395" font-family="sans-serif" font-size="12" fill="#166534" font-weight="bold">ЗОЛОТОЕ СЕЧЕНИЕ</text>
<text x="325" y="415" font-family="sans-serif" font-size="12" fill="#166534">Близость: 99.99%</text>
<text x="325" y="435" font-family="sans-serif" font-size="12" fill="#166534">Погрешность: 10^-15</text>
</svg>
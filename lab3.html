<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Interface Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1e1e1e; color: #d4d4d4; font-family: 'Segoe UI', sans-serif; }
        .vscode-bg { background-color: #252526; }
        .vscode-border { border-color: #3c3c3c; }
        .ai-bubble { background-color: #2d2d2d; border-radius: 4px; }
        .user-bubble { background-color: #0e639c; border-radius: 4px; }
    </style>
</head>
<body class="flex justify-center items-center h-screen">

    <!-- Макет боковой панели IDE -->
    <div class="w-80 h-[400px] vscode-bg border vscode-border flex flex-col shadow-2xl">
        
        <!-- Хедер панели -->
        <div class="p-3 border-b vscode-border flex justify-between items-center">
            <span class="text-xs font-bold uppercase tracking-wider text-gray-400">ЧАТ</span>
            <select class="bg-[#3c3c3c] text-[10px] rounded px-1 py-0.5 outline-none border-none">
                <option>Модель</option>
                <option>Claude 3.5 Sonnet</option>
                <option>Llama 3 (Local)</option>
            </select>
        </div>

        <!-- Область чата -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4 text-sm">
            <!-- Сообщение ИИ -->
            <div class="ai-bubble p-2 border border-gray-700">
                <p class="text-[11px] text-blue-400 mb-1 font-mono">ИИ:</p>
                Приветствие
            </div>

            <!-- Сообщение пользователя -->
            <div class="user-bubble p-2 text-white ml-4">
                <p class="text-[11px] opacity-70 mb-1">Пользователь:</p>
                Запрос
            </div>

 
        </div>


        <!-- Поле ввода -->
        <div class="p-3 bg-[#1e1e1e]">
            <div class="relative">
                <textarea 
                    class="w-full bg-[#3c3c3c] border vscode-border rounded p-2 text-xs focus:ring-1 focus:ring-blue-500 outline-none resize-none" 
                    rows="3" 
                    placeholder="Запрос"></textarea>
                <div class="absolute bottom-2 right-2 flex gap-2">
                    <button class="bg-[#0e639c] hover:bg-[#1177bb] text-white p-1 rounded">
                        <svg xmlns="http://www.w3.org" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
